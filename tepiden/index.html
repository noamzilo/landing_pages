<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tepiden — Ellos preguntan. Vos respondés.</title>
<meta name="description" content="Todos los días alguien en tu zona pide tu servicio. Nosotros escuchamos, vos llegás primero.">
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e4e6ea; --ink:#101418; --muted:#6b7480;
  --accent:#12b76a; --accent-ink:#fff; --bubble:#eef1f4; --bar:#12b76a;
  --radius:14px; --shadow:0 1px 2px rgba(16,20,24,.06),0 8px 24px rgba(16,20,24,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1216; --panel:#161b21; --line:#242c35; --ink:#e9edf2; --muted:#8b95a1;
  --bubble:#1d242c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 72px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 8px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.lang{display:flex;gap:2px;background:var(--bubble);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:600 12px/1 inherit;
  padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

h1{font-size:30px;line-height:1.15;letter-spacing:-.025em;margin:26px 0 10px}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 26px;font-size:16.5px}

/* ---- widget ---- */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 16px 16px}
.qlabel{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.qrow{display:flex;gap:8px}
.qrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);
  color:var(--ink);border-radius:11px;padding:13px 14px;font:16px/1 inherit}
.qrow input:focus{outline:0;border-color:var(--accent)}
.qrow button{flex:none;border:0;border-radius:11px;background:var(--accent);
  color:var(--accent-ink);font:600 15px/1 inherit;padding:0 18px;cursor:pointer}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);
  vertical-align:-3px;animation:blink .9s step-end infinite}
@keyframes blink{50%{opacity:0}}

.reframe{margin:18px 0 10px;font-size:13.5px;color:var(--muted)}

.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;margin:0 -16px;padding:0 16px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center}
.lead{background:var(--bubble);border-radius:4px 14px 14px 14px;padding:14px;
  font-size:15.5px;min-height:74px;display:flex;align-items:center}
.skel{height:15px;border-radius:7px;background:var(--line);margin:5px 0;
  animation:sheen 1.1s ease-in-out infinite}
.skel.s2{width:78%}.skel.s3{width:55%}
@keyframes sheen{50%{opacity:.45}}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 14px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot[aria-current=true]{background:var(--accent)}

.btn{display:block;width:100%;border:0;border-radius:11px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font:600 15px/1 inherit;padding:15px}
.btn:active{transform:translateY(1px)}
.alt{display:block;text-align:center;margin-top:12px;font-size:13.5px;
  color:var(--muted);text-decoration:none}
.alt:hover{color:var(--accent)}

/* ---- pay panel ---- */
.pay{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:16px}
.pay.on{display:block}
.price{text-align:center;margin-bottom:4px;font-size:25px;font-weight:700;letter-spacing:-.02em}
.price small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);
  letter-spacing:0;margin-top:3px}
.pay input{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:11px;padding:13px 14px;font:16px/1 inherit;margin-top:9px}
.pay input:focus{outline:0;border-color:var(--accent)}
.pay .btn{margin-top:11px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.done{display:none;text-align:center;padding:18px 4px}
.done.on{display:block}
.done b{display:block;font-size:17px;margin-bottom:6px}
.done span{color:var(--muted);font-size:14.5px}

/* ---- speed section ---- */
section{margin-top:56px}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 6px}
.lede{color:var(--muted);font-size:15px;margin:0 0 20px}
.bars{display:grid;gap:11px}
.brow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;font-size:13px}
.brow .t{color:var(--muted)}
.bfill{height:11px;border-radius:6px;background:var(--bar);min-width:3px}
.brow .v{font-weight:700;font-variant-numeric:tabular-nums}
.src{font-size:11.5px;color:var(--muted);margin-top:12px}
.src a{color:inherit}
blockquote{margin:26px 0 0;padding:15px 16px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;
  font-size:15.5px}
blockquote cite{display:block;margin-top:9px;font-style:normal;font-size:12.5px;color:var(--muted)}
blockquote cite a{color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:44px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">te<span>piden</span></div>
  <div class="lang">
    <button id="es" aria-pressed="true">ES</button>
    <button id="en" aria-pressed="false">EN</button>
  </div>
</header>

<h1 data-t="h1"></h1>
<p class="sub" data-t="sub"></p>

<div class="widget">
  <label class="qlabel" for="q" data-t="qlabel"></label>
  <div class="qrow">
    <input id="q" maxlength="120" autocomplete="off" spellcheck="false">
    <button id="go" data-t="go"></button>
  </div>

  <p class="reframe" data-t="reframe"></p>
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>

  <button class="btn" id="cta" data-t="cta"></button>
  <a class="alt" id="alt" href="#" data-t="alt"></a>

  <div class="pay" id="pay">
    <div class="price" id="price"></div>
    <input id="pname" autocomplete="name">
    <input id="pphone" inputmode="tel" autocomplete="tel">
    <button class="btn" id="psend" data-t="psend"></button>
    <p class="note" data-t="pnote"></p>
  </div>
  <div class="done" id="done"><b data-t="doneh"></b><span data-t="donep"></span></div>
</div>

<section>
  <h2 data-t="spdh"></h2>
  <p class="lede" data-t="spdl"></p>
  <div class="bars">
    <div class="brow"><span class="t" data-t="b1"></span><span><i class="bfill" style="width:100%"></i></span><span class="v">60×</span></div>
    <div class="brow"><span class="t" data-t="b2"></span><span><i class="bfill" style="width:14%"></i></span><span class="v">8,6×</span></div>
    <div class="brow"><span class="t" data-t="b3"></span><span><i class="bfill" style="width:2%"></i></span><span class="v">1×</span></div>
  </div>
  <p class="src" data-t="src"></p>

  <blockquote>
    <span data-t="hq"></span>
    <cite>Alex Hormozi — <a href="https://www.youtube.com/watch?v=R1G1ntNY32Y&amp;t=0s" target="_blank" rel="noopener">You Need to Call Your Leads Faster</a></cite>
  </blockquote>
</section>

<footer>tepiden · Asunción, Paraguay</footer>
</div>

<script>
/* ═══ constants — LAMBDA_URL and POSTHOG_KEY are public, not secrets ═══════ */
const LAMBDA_URL  = "https://jznndqelmqs3b2tu4nh764finq0ewomv.lambda-url.us-east-1.on.aws/";                       // set by make tepiden-create
const POSTHOG_KEY = "phc_yMzPdXzMAS73NqDvXYFp4KicxviVECwXDD36jsPW4qLr";                       // phc_… project key
const POSTHOG_HOST= "https://us.i.posthog.com";
const W = atob('OTcyNTQ3MjA0NTgx');           // never in the DOM; assembled on click
const PRICE_GS = 30000, PRICE_LABEL = "Gs. 30.000";
const EXAMPLE = { es:"dentista en Villa Morra", en:"dentist in Villa Morra" };

/* canned leads — shown on first load, and whenever the Lambda is slow or down.
   Same strings the Lambda falls back to. */
const CANNED = {
  es:["Alguien conoce un dentista por Villa Morra? Me duele una muela.",
      "Busco odontólogo para limpieza por la zona, alguna recomendación?",
      "Hay algún dentista que atienda hoy o mañana temprano?"],
  en:["Anyone know a dentist around Villa Morra? My tooth hurts.",
      "Looking for a dentist for a cleaning nearby, any recommendations?",
      "Is there a dentist available today or early tomorrow?"],
};

const T = {
es:{h1:'Ellos preguntan. <em>Vos respondés.</em>',
    sub:'Todos los días alguien en tu zona pide tu servicio en un grupo de WhatsApp. Nosotros escuchamos. Vos llegás primero.',
    qlabel:'¿A qué te dedicás y dónde?', qph:'plomero en Lambaré', go:'Ver',
    reframe:'Mirá qué tipo de pedidos encontramos para tu rubro:',
    cta:'Quiero clientes así →', alt:'o escribinos por WhatsApp',
    pricesub:'por cliente · no se cobra nada ahora',
    pnameph:'Tu nombre', pphoneph:'Tu WhatsApp', psend:'Anotarme',
    pnote:'No pedimos tarjeta. Solo te avisamos cuando haya un cliente real.',
    doneh:'Listo, ya estás anotado.', donep:'Te avisamos apenas tengamos un cliente real para vos.',
    spdh:'El que contesta primero se lleva el cliente.',
    spdl:'Harvard Business Review midió 2.241 empresas. Probabilidad de calificar un cliente, según cuánto tardás en contestar:',
    b1:'menos de 1 h', b2:'1 a 2 h', b3:'más de 24 h',
    src:'Oldroyd, McElheran y Elkington, «The Short Life of Online Sales Leads», Harvard Business Review, 2011. Promedio de respuesta medido: 42 horas. El 23% nunca contestó.',
    hq:'«Hay muchísima investigación que sugiere que podés multiplicar por cuatro o cinco tu conversión llamando a tus clientes dentro de los primeros 60 segundos.»'},
en:{h1:'They ask. <em>You answer.</em>',
    sub:'Every day someone in your area asks for your service in a WhatsApp group. We listen. You get there first.',
    qlabel:'What do you do, and where?', qph:'plumber in Lambaré', go:'Go',
    reframe:'Here is the kind of request we find for your trade:',
    cta:'I want customers like these →', alt:'or message us on WhatsApp',
    pricesub:'per customer · nothing is charged now',
    pnameph:'Your name', pphoneph:'Your WhatsApp', psend:'Sign me up',
    pnote:'No card required. We just tell you when a real customer shows up.',
    doneh:'Done, you are on the list.', donep:'We will message you as soon as we have a real customer for you.',
    spdh:'Whoever answers first gets the customer.',
    spdl:'Harvard Business Review measured 2,241 companies. Odds of qualifying a lead, by how long you take to answer:',
    b1:'under 1 h', b2:'1 to 2 h', b3:'over 24 h',
    src:'Oldroyd, McElheran and Elkington, "The Short Life of Online Sales Leads", Harvard Business Review, 2011. Measured average response: 42 hours. 23% never replied.',
    hq:'"There is tons of research that suggests you can four or five x your conversion of leads by calling them within 60 seconds."'},
};

/* ═══ analytics ═══════════════════════════════════════════════════════════ */
!function(){if(!POSTHOG_KEY)return;
 !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init me ws ys ps bs capture je Di ks register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey getNextSurveyStep identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty Ts $s createPersonProfile Ps bt Is opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing Ss debug ke getPageViewId captureTraceFeedback captureTraceMetric".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
 posthog.init(POSTHOG_KEY,{api_host:POSTHOG_HOST,person_profiles:'always'});}();
const track = (e,p) => { try{ if(window.posthog&&POSTHOG_KEY) posthog.capture(e,p); }catch(_){} };

/* ═══ state ═══════════════════════════════════════════════════════════════ */
let lang = 'es', live = false, leads = CANNED.es.slice(), idx = 0;
let variant = 'pay', source = 'canned', business = '';
const $ = id => document.getElementById(id);
const vid = (()=>{ try{ let v=localStorage.getItem('tp_v');
  if(!v){ v=Math.random().toString(36).slice(2,7); localStorage.setItem('tp_v',v);} return v;
 }catch(_){ return Math.random().toString(36).slice(2,7); } })();

const wa = t => window.open('https://wa.me/'+W+'?text='+encodeURIComponent(t),'_blank');
const ctaText = () => (lang==='es'
  ? 'Hola! Quiero clientes así' + (business? ' — '+business : '') + ' · v'+vid
  : 'Hi! I want customers like these' + (business? ' — '+business : '') + ' · v'+vid);

/* ═══ carousel ════════════════════════════════════════════════════════════ */
function renderLeads(skeleton){
  const track_ = $('track'), dots = $('dots');
  track_.replaceChildren(); dots.replaceChildren();
  const n = skeleton ? 3 : leads.length;
  for(let i=0;i<n;i++){
    const s = document.createElement('div'); s.className='slide';
    const c = document.createElement('div'); c.className='lead';
    if(skeleton){
      c.replaceChildren(...['','s2','s3'].map(k=>{
        const b=document.createElement('div'); b.className='skel '+k; return b;}));
      c.style.display='block';
    } else {
      c.textContent = leads[i];            // never innerHTML: LLM + visitor text
    }
    s.appendChild(c); track_.appendChild(s);

    const d = document.createElement('button');
    d.className='dot'; d.setAttribute('aria-label','Lead '+(i+1));
    d.setAttribute('aria-current', String(i===idx));
    d.onclick = () => { hand(); go(i); };
    dots.appendChild(d);
  }
}
function go(i){
  idx=i;
  const t=$('track'); t.scrollTo({left:i*t.clientWidth, behavior:'smooth'});
  [...$('dots').children].forEach((d,j)=>d.setAttribute('aria-current',String(j===i)));
  track('lead_swiped',{index:i});
}
$('track').addEventListener('scroll', ()=>{
  const t=$('track'), i=Math.round(t.scrollLeft/t.clientWidth);
  if(i!==idx && i>=0 && i<leads.length){ idx=i;
    [...$('dots').children].forEach((d,j)=>d.setAttribute('aria-current',String(j===i))); }
}, {passive:true});

/* ═══ lead fetch — always resolves, always three leads ════════════════════ */
async function fetchLeads(){
  business = $('q').value.trim();
  if(!business) return;
  track('searched',{text:business});
  renderLeads(true);
  const t0 = performance.now();
  let data;
  if(LAMBDA_URL){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), 3500);
    try{
      const r = await fetch(LAMBDA_URL,{method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({business,lang}), signal:ctl.signal});
      data = await r.json();
    }catch(_){ data = {leads:CANNED[lang], source:'client_fallback'}; }
    clearTimeout(timer);
  } else {
    data = {leads:CANNED[lang], source:'no_endpoint'};
  }
  leads = (Array.isArray(data.leads)&&data.leads.length ? data.leads : CANNED[lang]).slice(0,3);
  source = data.source || 'unknown';
  idx = 0; renderLeads(false);
  track('leads_shown',{n:leads.length, source, latency_ms:Math.round(performance.now()-t0)});
}

/* ═══ i18n ════════════════════════════════════════════════════════════════ */
function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(n=>n.innerHTML = t[n.dataset.t]);
  $('q').placeholder = t.qph;
  $('pname').placeholder = t.pnameph;
  $('pphone').placeholder = t.pphoneph;
  $('price').replaceChildren(document.createTextNode(PRICE_LABEL),
    Object.assign(document.createElement('small'),{textContent:t.pricesub}));
  $('es').setAttribute('aria-pressed', lang==='es');
  $('en').setAttribute('aria-pressed', lang==='en');
  $('alt').style.display = variant==='pay' ? 'block' : 'none';
  renderLeads(false);
}

/* ═══ handover ════════════════════════════════════════════════════════════ */
function hand(){ live = true; }
['pointerdown','keydown','wheel','touchstart'].forEach(e=>
  addEventListener(e, hand, {once:true, passive:true}));

/* ═══ wiring ══════════════════════════════════════════════════════════════ */
$('es').onclick = ()=>{ hand(); lang='es'; leads=CANNED.es.slice(); render(); };
$('en').onclick = ()=>{ hand(); lang='en'; leads=CANNED.en.slice(); render(); };
$('go').onclick = ()=>{ hand(); fetchLeads(); };
$('q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ hand(); fetchLeads(); } });

$('cta').onclick = ()=>{
  track('buy_click',{variant, price_shown:PRICE_GS, business_text:business, lead_index:idx});
  if(variant==='whatsapp'){ track('wa_opened',{}); wa(ctaText()); }
  else { $('pay').classList.add('on'); $('cta').style.display='none';
         track('pay_viewed',{}); $('pname').focus(); }
};
$('alt').onclick = e=>{ e.preventDefault(); track('wa_opened',{from:'alt'}); wa(ctaText()); };
$('psend').onclick = ()=>{
  const name=$('pname').value.trim(), phone=$('pphone').value.trim();
  if(!phone){ $('pphone').focus(); return; }
  try{ if(window.posthog&&POSTHOG_KEY) posthog.setPersonProperties({name, whatsapp:phone, business}); }catch(_){}
  track('pay_submitted',{has_phone:true, has_name:!!name, price_shown:PRICE_GS, business_text:business});
  $('pay').classList.remove('on'); $('done').classList.add('on');
};

/* ═══ boot ════════════════════════════════════════════════════════════════ */
(function boot(){
  const p = new URLSearchParams(location.search);
  const forced = p.get('variant');
  variant = (forced==='whatsapp'||forced==='pay') ? forced : 'pay';
  render();

  const land = {variant, vid};
  ['utm_source','utm_medium','utm_campaign','utm_content'].forEach(k=>{
    if(p.get(k)) land[k]=p.get(k); });
  land.referrer = document.referrer || '';
  track('land', land);

  // sticky A/B assignment from PostHog when it is configured
  if(POSTHOG_KEY && !forced){ try{ posthog.onFeatureFlags(()=>{
    const v = posthog.getFeatureFlag('cta-variant');
    if((v==='whatsapp'||v==='pay') && v!==variant){
      variant=v; posthog.register({variant:v});
      $('alt').style.display = v==='pay'?'block':'none'; }
  }); }catch(_){} }

  new IntersectionObserver((es,o)=>{ es.forEach(e=>{ if(e.isIntersecting){
    track('widget_viewed',{}); o.disconnect(); }}); })
    .observe(document.querySelector('.widget'));

  // autoplay: type the example, then show the canned leads. Any touch cancels it.
  const box = $('q'), txt = EXAMPLE[lang];
  setTimeout(function tick(i){
    return function(){
      if(live){ if(!box.value) box.value = txt; return; }
      box.value = txt.slice(0, i);
      if(i < txt.length) setTimeout(tick(i+1), 55);
      else { business = txt; }
    };
  }(1), 900);
})();
</script>
</body>
</html>
