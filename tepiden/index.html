<meta charset="utf-8">

<title>tepiden — Ellos preguntan. Tú respondes.</title>

<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e4e6ea; --ink:#101418; --muted:#6b7480;
  --accent:#12b76a; --accent-ink:#fff; --bubble:#eef1f4; --bar:#12b76a;
  --radius:14px; --shadow:0 1px 2px rgba(16,20,24,.06),0 8px 24px rgba(16,20,24,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1216; --panel:#161b21; --line:#242c35; --ink:#e9edf2; --muted:#8b95a1;
  --bubble:#1d242c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 8px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.lang{display:flex;gap:2px;background:var(--bubble);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:600 12px/1 inherit;
  padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

h1{font-size:30px;line-height:1.15;letter-spacing:-.025em;margin:26px 0 10px}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 26px;font-size:16.5px}

/* ---- widget ---- */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 16px 16px}
.qlabel{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.qrow{display:flex;gap:8px}
.qrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);
  color:var(--ink);border-radius:11px;padding:13px 14px;font:16px/1 inherit}
.qrow input:focus{outline:0;border-color:var(--accent)}
.qrow button{flex:none;border:0;border-radius:11px;background:var(--accent);
  color:var(--accent-ink);font:600 15px/1 inherit;padding:0 18px;cursor:pointer}

.reframe{margin:18px 0 10px;font-size:13.5px;color:var(--muted)}

/* ---- the lead cards: stacked, never a carousel ---- */
.feed{display:flex;flex-direction:column;gap:10px}
.bubble{background:var(--bubble);border-radius:4px 14px 14px 14px;padding:13px 14px}
.msg{font-size:15.5px}
/* the card footer reads as product, not as a disclaimer */
.cardfoot{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px;font-size:12.5px}
.klabel{color:var(--muted)}
.held{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.07em}
.lock{margin-left:auto;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.skel{height:14px;border-radius:7px;background:var(--line);margin:5px 0;
  animation:sheen 1.1s ease-in-out infinite}
.skel.s2{width:78%}.skel.s3{width:55%}
@keyframes sheen{50%{opacity:.45}}
.honest{margin:12px 0 16px;font-size:12.5px;color:var(--muted)}

.btn{display:block;width:100%;border:0;border-radius:11px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font:600 15px/1 inherit;padding:15px}
.btn:active{transform:translateY(1px)}

/* ---- pay panel ---- */
.pay{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:16px}
.pay.on{display:block}
.price{text-align:center;margin-bottom:4px;font-size:25px;font-weight:700;letter-spacing:-.02em}
.price small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);
  letter-spacing:0;margin-top:3px}
.pay input{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:11px;padding:13px 14px;font:16px/1 inherit;margin-top:9px}
.pay input:focus{outline:0;border-color:var(--accent)}
.pay .btn{margin-top:11px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.done{display:none;text-align:center;padding:18px 4px}
.done.on{display:block}
.done b{display:block;font-size:17px;margin-bottom:6px}
.done span{color:var(--muted);font-size:14.5px}

/* ---- sections ---- */
section{margin-top:48px}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 6px}
.lede{color:var(--muted);font-size:15px;margin:0 0 18px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding-left:30px;margin-bottom:11px;font-size:15px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;
  width:21px;height:21px;border-radius:50%;background:var(--bubble);color:var(--accent);
  font:700 12px/21px inherit;text-align:center}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-size:14.5px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--accent);font-weight:700}
details[open] summary::before{content:"− "}
details p{font-size:14px;color:var(--muted);margin:11px 0 0}

.bars{display:grid;gap:11px}
.brow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;font-size:13px}
.brow .t{color:var(--muted)}
.bfill{display:block;height:11px;border-radius:6px;background:var(--bar);min-width:3px}
.brow .v{font-weight:700;font-variant-numeric:tabular-nums}
.src{font-size:11.5px;color:var(--muted);margin-top:12px}

/* closing CTA block — 12 of 15 pages studied end on one */
.close{margin-top:48px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 20px;text-align:center}
.close h2{margin:0 0 7px}
.close p{margin:0 0 18px;color:var(--muted);font-size:15px}
.close .btn{max-width:340px;margin:0 auto}

footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;gap:13px;align-items:flex-start}
footer img{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover}
footer p{margin:0;font-size:13.5px;color:var(--muted)}
footer b{color:var(--ink);font-weight:600}
</style>
</head>

/* ═══ state ═══════════════════════════════════════════════════════════════ */
let lang = 'es', leads = CANNED.es.slice();

/* ═══ the lead cards ══════════════════════════════════════════════════════
   The card shows the product: the message at full fidelity, and the one field
   we sell, masked. Nothing on the card apologises for itself — that fact is
   stated once, below the feed, not stamped on every row. */
function renderLeads(skeleton){
  const t = T[lang], feed = $('feed');
  feed.replaceChildren();
  for(let i=0; i<3; i++){
    const b = document.createElement('div'); b.className='bubble';
    const m = document.createElement('div'); m.className='msg';
    if(skeleton){
      m.replaceChildren(...['','s2','s3'].map(k=>{
        const s=document.createElement('div'); s.className='skel '+k; return s;}));
    } else {
      m.textContent = leads[i] || '';       // never innerHTML: LLM + visitor text
    }
    b.appendChild(m);
    if(!skeleton){
      const f = document.createElement('div'); f.className='cardfoot';
      const k = document.createElement('span'); k.className='klabel'; k.textContent = t.lphone;
      const v = document.createElement('span'); v.className='held'; v.textContent = PHONE_MASK;
      const lock = document.createElement('span'); lock.className='lock'; lock.textContent = t.locked;
      f.append(k, v, lock);
      b.appendChild(f);
    }
    feed.appendChild(b);
  }
}

/* ═══ lead fetch — always resolves, always three leads ════════════════════ */
async function fetchLeads(){
  business = $('q').value.trim();
  if(!business) return;
  track('searched',{text:business});
  renderLeads(true);
  const t0 = performance.now();
  let data;
  if(LAMBDA_URL){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), 3500);
    try{
      const r = await fetch(LAMBDA_URL,{method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({business,lang}), signal:ctl.signal});
      data = await r.json();
    }catch(_){ data = {leads:CANNED[lang], source:'client_fallback'}; }
    clearTimeout(timer);
  } else {
    data = {leads:CANNED[lang], source:'no_endpoint'};
  }
  leads = (Array.isArray(data.leads)&&data.leads.length ? data.leads : CANNED[lang]).slice(0,3);
  source = data.source || 'unknown';
  renderLeads(false);
  track('leads_shown',{n:leads.length, source, latency_ms:Math.round(performance.now()-t0)});
}

/* ═══ i18n ════════════════════════════════════════════════════════════════ */
function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(n=>n.innerHTML = t[n.dataset.t]);
  $('pname').placeholder = t.pnameph;
  $('pphone').placeholder = t.pphoneph;
  $('price').replaceChildren(document.createTextNode(PRICE_LABEL),
    Object.assign(document.createElement('small'),{textContent:t.pricesub}));
  $('rubros').replaceChildren(...TRADES[lang].map(v=>
    Object.assign(document.createElement('option'),{value:v})));
  $('es').setAttribute('aria-pressed', lang==='es');
  $('en').setAttribute('aria-pressed', lang==='en');
  renderLeads(false);
}

/* ═══ placeholder rotation ════════════════════════════════════════════════ */
let rotTimer = null, rotStopped = false;
function stopRotation(){ rotStopped = true; clearTimeout(rotTimer); }
function startRotation(){
  const box = $('q');
  const pool = PLACEHOLDERS[lang].slice().sort(()=>Math.random()-0.5).slice(0,3);
  box.placeholder = pool[0];
  const reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;                        // first string only, no motion
  const step = i => () => {
    if(rotStopped) return;
    box.placeholder = pool[i];
    if(i < pool.length-1) rotTimer = setTimeout(step(i+1), 1700);
  };
  rotTimer = setTimeout(step(1), 1700);     // 0s / 1.7s / 3.4s, done well under 5s
}
['focus','pointerdown','keydown'].forEach(e=>
  addEventListener(e, stopRotation, {once:true, passive:true, capture:true}));

/* ═══ wiring ══════════════════════════════════════════════════════════════ */
$('es').onclick = ()=>{ lang='es'; leads=CANNED.es.slice(); render(); };
$('en').onclick = ()=>{ lang='en'; leads=CANNED.en.slice(); render(); };
$('go').onclick = ()=>{ stopRotation(); fetchLeads(); };
$('q').addEventListener('keydown', e=>{ if(e.key==='Enter') fetchLeads(); });
$('closecta').onclick = ()=>{
  track('close_cta_click',{variant});
  document.querySelector('.widget').scrollIntoView({behavior:'smooth', block:'start'});
  setTimeout(()=>$('q').focus(), 400);       // the real first step is typing a trade
};

$('cta').onclick = ()=>{
  track('buy_click',{variant, price_shown:PRICE_USD, currency:'USD', business_text:business});
  if(variant==='whatsapp'){ track('wa_opened',{}); wa(ctaText()); }
  else { $('pay').classList.add('on'); $('cta').style.display='none';
         track('pay_viewed',{}); $('pname').focus(); }
};
$('psend').onclick = ()=>{
  const name=$('pname').value.trim(), phone=$('pphone').value.trim();
  if(!phone){ $('pphone').focus(); return; }
  try{ if(window.posthog&&POSTHOG_KEY) posthog.setPersonProperties({name, whatsapp:phone, business}); }catch(_){}
  track('pay_submitted',{has_phone:true, has_name:!!name, price_shown:PRICE_USD, currency:'USD', business_text:business});
  $('pay').classList.remove('on'); $('done').classList.add('on');
};

/* ═══ boot ════════════════════════════════════════════════════════════════ */
(function boot(){
  const p = new URLSearchParams(location.search);
  const forced = p.get('variant');
  variant = (forced==='whatsapp'||forced==='pay') ? forced : 'pay';
  render();
  startRotation();

  const land = {variant, vid};
  ['utm_source','utm_medium','utm_campaign','utm_content'].forEach(k=>{
    if(p.get(k)) land[k]=p.get(k); });
  land.referrer = document.referrer || '';
  track('land', land);

  // sticky A/B assignment from PostHog when it is configured
  if(POSTHOG_KEY && !forced){ try{ posthog.onFeatureFlags(()=>{
    const v = posthog.getFeatureFlag('cta-variant');
    if((v==='whatsapp'||v==='pay') && v!==variant){
      variant=v; posthog.register({variant:v}); }
  }); }catch(_){} }

  new IntersectionObserver((es,o)=>{ es.forEach(e=>{ if(e.isIntersecting){
    track('widget_viewed',{}); o.disconnect(); }}); })
    .observe(document.querySelector('.widget'));
})();
</script>
</body>
</html>
